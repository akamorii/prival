services:
  frontend:
    build:
      context: ./frontend
      args:
        # Пусто = относительные /api, /uploads — nginx этого же контейнера проксирует их на backend.
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - '${FRONTEND_PORT:-80}:80'
      - '${FRONTEND_SSL_PORT:-443}:443'
    volumes:
      - ./frontend/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      # Сертификат Cloudflare Origin CA (альтернатива Let's Encrypt, см. scripts/cloudflare-ssl.sh).
      - ./frontend/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-privalcafe}:${DB_PASSWORD:-privalcafe}@db:5432/${DB_NAME:-privalcafe}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
      ADMIN_PASSCODE: ${ADMIN_PASSCODE:-privaladmin}
      ENCRYPTION_KEY: '${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env, see .env.example}'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://prival.pro,https://www.prival.pro,http://prival.pro,http://www.prival.pro}
    ports:
      # Не обязателен для работы сайта (nginx проксирует /api по внутренней сети) —
      # оставлен открытым для прямого захода в /docs при отладке. Можно закомментировать.
      - '${BACKEND_PORT:-8000}:8000'
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-privalcafe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-privalcafe}
      POSTGRES_DB: ${DB_NAME:-privalcafe}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5432}:5432'
    restart: unless-stopped

  # Выпуск и продление сертификата Let's Encrypt для prival.pro.
  # Первый сертификат — через scripts/init-letsencrypt.sh, дальше этот сервис
  # сам продляет его раз в 12 часов; frontend сам перечитывает сертификат (см. docker-entrypoint.sh).
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Задел на будущее (см. ТЗ п.20): онлайн-оплата, Telegram-уведомления,
  # кухонный экран (KDS), печать чеков, интеграция с кассой — добавляются
  # отдельными сервисами здесь, когда придёт их очередь.
  # ---------------------------------------------------------------------

volumes:
  db-data:
  uploads-data:
  certbot-etc:
  certbot-www:
