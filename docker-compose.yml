services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_ADMIN_PASSCODE: ${VITE_ADMIN_PASSCODE:-privaladmin}
    ports:
