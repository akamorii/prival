services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_ADMIN_PASSCODE: ${VITE_ADMIN_PASSCODE:-privaladmin}
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-privalcafe}:${DB_PASSWORD:-privalcafe}@db:5432/${DB_NAME:-privalcafe}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
      ADMIN_PASSCODE: ${VITE_ADMIN_PASSCODE:-privaladmin}
      ENCRYPTION_KEY: '${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env, see .env.example}'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-privalcafe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-privalcafe}
      POSTGRES_DB: ${DB_NAME:-privalcafe}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5432}:5432'
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Задел на будущее (см. ТЗ п.20): онлайн-оплата, Telegram-уведомления,
  # кухонный экран (KDS), печать чеков, интеграция с кассой — добавляются
  # отдельными сервисами здесь, когда придёт их очередь.
  # ---------------------------------------------------------------------

volumes:
  db-data:
  uploads-data:
