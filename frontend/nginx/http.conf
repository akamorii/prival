# HTTP-only конфигурация. Активна по умолчанию (до выпуска сертификата) —
# именно этот файл копируется в frontend/nginx/active.conf при первом запуске.
# После scripts/init-letsencrypt.sh active.conf заменяется на содержимое https.conf.

server {
    listen 80;
    server_name prival.online www.prival.online;

    root /usr/share/nginx/html;
    index index.html;

    # Нужно для проверки владения доменом при выпуске/продлении сертификата Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
